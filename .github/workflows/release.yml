name: Build & Release

# Builds the native app for Windows, macOS, Linux, and Android / Android TV.
# On a version tag (v*) the artifacts are attached to a GitHub Release; on a manual
# run they're uploaded as workflow artifacts so the build can be tested without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # WHY A SCHEDULE ON A RELEASE WORKFLOW. Every leg here — Windows, macOS, iOS, Linux, and the three
  # Android ABIs — is built ONLY by this workflow, and until now this workflow ran only on a tag. ci.yml
  # builds the Linux headless probes and a Windows RetroPark-probe binary; it never builds the app for
  # ANY platform. So between two releases nothing exercised these seven builds, and they rotted quietly:
  # v0.6.3 needed four fixes to go out (a missing Vulkan SDK, a missing submodule checkout, a generator
  # assumption that only holds under Visual Studio, and a ${} spelling inside an Info.plist.in COMMENT
  # that configure_file expanded), every one of them pre-existing and none of them a tagging problem.
  # A weekly build finds that class the week it lands instead of at the tag, when it blocks a release.
  #
  # This is safe to run unattended because every publish step below is gated on refs/tags — a non-tag
  # run builds all seven legs and uploads them as workflow artifacts, publishing nothing. That is the
  # exact dry-run path used to clear v0.6.3; the schedule just stops it depending on someone remembering.
  schedule:
    - cron: '0 6 * * 0'   # Sundays 06:00 UTC (default branch only, per GitHub's scheduling rules)

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'
  SDL2_VERSION: '2.30.9'
  # Every install-qt-action step pins aqtinstall and py7zr instead of taking the action's defaults. The defaults
  # are part of the action's cache key, so a moved action tag changed them, missed the cache, and the cold
  # install met an aqt that could not resolve Qt 6.8.3 for Android (#405). 3.3.0 is the first aqt that lists
  # Android under all_os; 1.1.0 is v4.4.0's own default (its Windows Bad7zFile workaround).
  AQT_VERSION: '==3.3.0'
  PY7ZR_VERSION: '==1.1.0'

jobs:
  # ---------------------------------------------------------------- Windows ---
  windows:
    runs-on: windows-latest
    steps:
      # submodules: RetroPark is one, and the desktop-Windows CMake block ExternalProject_Add's it from
      # native/../external/RetroPark. Without this the configure gets as far as finding Vulkan and then dies
      # on "No download info given for 'retropark_ext'" — the same ci.yml-vs-release.yml drift as the Vulkan
      # step above, found the same way. The other legs do not build RetroPark and do not need this.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtpdf qtspeech'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch libmpv (dev)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-2*' -and $_.name -notlike '*-v3-*' } | Select-Object -First 1
          if (-not $asset) { throw 'No mpv-dev-x86_64 asset found' }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          New-Item -ItemType Directory -Force -Path mpv | Out-Null
          7z x mpv-dev.7z -ompv | Out-Null
          $dll = Get-ChildItem mpv -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in package' }
          Write-Host "DLL: $($dll.FullName)"
          # Build the MSVC import library from the DLL's REAL export names (robust regardless of how the
          # shipped .def is formatted — the prior def-based lib produced unresolved symbols).
          $names = & dumpbin /nologo /exports $dll.FullName | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
          }
          Write-Host "Parsed $($names.Count) exports"
          if ($names.Count -lt 20) { throw "Too few exports parsed ($($names.Count))" }
          "EXPORTS" | Set-Content mpv\libmpv.def -Encoding ascii
          $names | Add-Content mpv\libmpv.def -Encoding ascii
          lib /nologo /def:mpv\libmpv.def /name:libmpv-2.dll /out:mpv\mpv.lib /MACHINE:X64
          if (-not (& dumpbin /nologo /linkermember:1 mpv\mpv.lib | Select-String 'mpv_create')) {
            throw 'Generated mpv.lib is missing mpv_create'
          }
          "MPV_DIR=$((Resolve-Path mpv).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch SDL2 (dev)
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          Invoke-WebRequest $url -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2 -Force
          "SDL2_DIR=$((Resolve-Path "sdl2/SDL2-$env:SDL2_VERSION").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # find_package(Vulkan REQUIRED) resolves against VULKAN_SDK, which this action exports to the env. The
      # RetroPark block is desktop-Windows-only and no longer opt-in, so this configure needs Vulkan whether
      # or not anything here touches RetroPark — and install_runtime:true also drops vulkan-1.dll on the
      # runner, which the built exe import-links through RetroPark's PUBLIC link.
      #
      # This step is why a release's Windows leg failed while ci.yml's Windows leg passed: ci.yml gained it
      # when the EB_WITH_RETROPARK gate was retired and this workflow did not. Nobody saw it because the
      # release workflow only runs on a v* tag, and the last one predates that change. Keep the two in step.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          # EB_WINDEPLOYQT=OFF: the Package step below runs windeployqt explicitly on dist/, so the
          # in-build POST_BUILD deploy would only duplicate it (and cost minutes). Skip it here.
          cmake -S native -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DEVERYTHINGBOX_BUILD_APP=ON `
            -DEB_WINDEPLOYQT=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DMPV_INCLUDE_DIR="$env:MPV_DIR/include" `
            -DMPV_LIBRARY="$env:MPV_DIR/mpv.lib" `
            -DSDL2_INCLUDE_DIR="$env:SDL2_DIR/include" `
            -DSDL2_LIBRARY="$env:SDL2_DIR/lib/x64/SDL2.lib"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/EverythingBox"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/EverythingBox.exe $dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --qmldir native/src/theme2/qml "$dist/EverythingBox.exe"
          Copy-Item "$env:MPV_DIR/libmpv-2.dll" $dist/
          Copy-Item "$env:SDL2_DIR/lib/x64/SDL2.dll" $dist/
          # Bundle the sample addons + the StreamingAssets the app ships with.
          if (Test-Path native/addons)    { Copy-Item native/addons    "$dist/addons"    -Recurse -Force }
          if (Test-Path native/themes2)   { Copy-Item native/themes2   "$dist/themes2"   -Recurse -Force }
          # The SDL controller database. Both loaders read it from the EXE'S OWN directory
          # (SDL_GetBasePath), so it has to sit beside EverythingBox.exe, not under a data folder.
          Copy-Item native/gamecontrollerdb.txt "$dist/"
          Copy-Item native/resources/Uninstall.cmd "$dist/"  # standalone uninstaller (for when the app won't launch)
          Compress-Archive -Path "$dist/*" -DestinationPath EverythingBox-windows-x64.zip -Force
          # Ship the debug symbols as a SEPARATE asset (not in the app zip — no need to bloat every download by
          # ~25 MB). Keep it to symbolize a crash report from this exact build: match the .pdb to a dump by GUID.
          if (Test-Path build/EverythingBox.pdb) { Compress-Archive -Path build/EverythingBox.pdb -DestinationPath EverythingBox-windows-x64-pdb.zip -Force }

      # Read the zip back before anything is uploaded or attached (issue #319). Every line of the Package
      # step above was, until this one, REVIEWED AND NEVER TESTED: this workflow runs on a tag, nothing
      # opened what it produced, and #317 was a data file that existed, was correct, and simply never
      # travelled. The check extracts the archive and asserts the manifest against THIS checkout -- the
      # bundled trees file by file, the controller database byte for byte, and every DLL the executable
      # import-links. A hole fails the release here instead of reaching a download.
      - name: Verify the archive
        shell: pwsh
        run: python native/tools/verify-release-archive.py --kind windows --archive EverythingBox-windows-x64.zip --repo .

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBox-windows-x64
          path: |
            EverythingBox-windows-x64.zip
            EverythingBox-windows-x64-pdb.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EverythingBox-windows-x64.zip
            EverythingBox-windows-x64-pdb.zip
          generate_release_notes: true

  # ------------------------------------------------------------------ macOS ---
  macos:
    # Pinned (not macos-latest): the newest SDK on the rolling 'latest' image dropped the legacy AGL
    # framework that the Qt/GL link still references. macos-14 (arm64) ships an SDK that still has it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install mpv sdl2

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtpdf qtspeech'
          cache: true

      - name: Configure
        run: |
          cmake -S native -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVERYTHINGBOX_BUILD_APP=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DMPV_INCLUDE_DIR="$(brew --prefix mpv)/include" \
            -DMPV_LIBRARY="$(brew --prefix mpv)/lib/libmpv.dylib" \
            -DSDL2_INCLUDE_DIR="$(brew --prefix sdl2)/include/SDL2" \
            -DSDL2_LIBRARY="$(brew --prefix sdl2)/lib/libSDL2.dylib"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (.dmg)
        run: |
          APP=$(find build -name 'EverythingBox.app' -maxdepth 3 | head -n1)
          if [ -z "$APP" ]; then echo "No .app bundle produced"; ls -R build | head -50; exit 1; fi
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -dmg
          mv "$(dirname "$APP")/EverythingBox.dmg" EverythingBox-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBox-macos-arm64
          path: EverythingBox-macos-arm64.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EverythingBox-macos-arm64.dmg
          generate_release_notes: true

  # -------------------------------------------------------------------- iOS ---
  # Unsigned device build (arm64) packaged as an .ipa — iOS has no sideload-an-unsigned-binary path
  # like Android, so users re-sign it with their own Apple ID via AltStore / Sideloadly (standard for
  # open-source iOS apps distributed outside the App Store). libmpv + its static dependency stack come
  # from MPVKit's prebuilt xcframeworks (fetch-mpvkit-ios.sh). Toolchain notes: native/docs/ios-port.md.
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Host (desktop) Qt first — qt-cmake for iOS chains to its build tools via QT_HOST_PATH.
      - name: Install Qt (host, macOS)
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Remember host Qt path
        run: echo "QT_HOST_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (iOS)
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: mac
          target: ios
          modules: 'qtmultimedia qtpdf qtspeech'
          cache: true

      - name: Fetch libmpv static stack (MPVKit)
        run: bash native/tools/fetch-mpvkit-ios.sh "$HOME/ios-deps/mpvkit"

      - name: Configure (device arm64, unsigned)
        run: |
          DEV="$HOME/ios-deps/mpvkit/Libmpv.xcframework/ios-arm64/Libmpv.framework"
          "$QT_ROOT_DIR/bin/qt-cmake" -S native -B build-ios -G Xcode \
            -DEVERYTHINGBOX_BUILD_APP=ON \
            -DQT_HOST_PATH="$QT_HOST_DIR" \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DMPV_INCLUDE_DIR="$DEV/Headers" \
            -DMPV_LIBRARY="$DEV/Libmpv" \
            -DEB_IOS_MPV_DEPS_DIR="$HOME/ios-deps/mpvkit"

      - name: Build
        run: cmake --build build-ios --config Release

      - name: Package (.ipa, unsigned)
        run: |
          APP=$(find build-ios -maxdepth 3 -name 'EverythingBox.app' -path '*iphoneos*' | head -n1)
          if [ -z "$APP" ]; then echo "No .app bundle produced"; find build-ios -maxdepth 3 | head -50; exit 1; fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../EverythingBox-ios-arm64.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBox-ios-arm64
          path: EverythingBox-ios-arm64.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EverythingBox-ios-arm64.ipa
          generate_release_notes: true

  # ------------------------------------------------------------------ Linux ---
  linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      # libspeechd2 (issue #403): read-aloud (#145) pulls in Qt's texttospeech module, and its speechd backend
      # plugin (libqtexttospeech_speechd.so) links libspeechd.so.2. linuxdeploy-plugin-qt resolves every
      # dependency of every plugin it deploys and FAILS the package on one it cannot find, so without the
      # client library here the AppImage step died after a full, successful build. libspeechd is not on the
      # AppImage excludelist, so linuxdeploy bundles it and a user's host does not need it. Only the runtime
      # library is needed (the plugin is prebuilt; nothing compiles against it), and --no-install-recommends
      # keeps the speech-dispatcher DAEMON off the runner -- which the smoke step below relies on.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            libmpv-dev libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libpulse-dev \
            libxkbcommon-dev libfuse2 file \
            libspeechd2

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtpdf qtspeech'
          cache: true

      - name: Configure
        run: |
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVERYTHINGBOX_BUILD_APP=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (AppImage)
        run: |
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin
          cp build/EverythingBox $APPDIR/usr/bin/
          cp native/gamecontrollerdb.txt $APPDIR/usr/bin/  # SDL reads it from the binary's own dir
          # The two bundled trees (issue #339). They go BESIDE THE BINARY, not at the AppDir root and
          # not under usr/share, because AppPaths::dataDir() is QCoreApplication::applicationDirPath()
          # on Linux exactly as it is on Windows: ThemeEngine reads <dataDir>/themes2 and AddonManager
          # reads <dataDir>/addons, one directory each, with no search and no fallback. Every AppImage
          # released before this shipped neither, so Linux had no bundled theme (the themed home fell
          # back to classic) and no first-party add-on. The Windows zip has always copied both; this
          # brings the AppImage up to it. verify-release-archive.py asserts them, at this path.
          cp -r native/themes2 $APPDIR/usr/bin/
          cp -r native/addons  $APPDIR/usr/bin/
          cp native/resources/appicon.png EverythingBox.png
          cat > EverythingBox.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EverythingBox
          Comment=EverythingBox — one place for your films, shows, music, books, comics and games.
          Exec=EverythingBox
          Icon=EverythingBox
          Categories=AudioVideo;Player;
          Terminal=false
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_PLUGINS="multimedia;tls;networkinformation;imageformats"
          export OUTPUT=EverythingBox-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir $APPDIR \
            -e build/EverythingBox -i EverythingBox.png -d EverythingBox.desktop \
            --plugin qt --output appimage
          # $OUTPUT sets the produced name; fall back to whatever AppImage was emitted (excluding the tools).
          if [ ! -f "$OUTPUT" ]; then
            f=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' | head -n1)
            mv "$f" "$OUTPUT"
          fi
          ls -la "$OUTPUT"

      # The same read-back for the AppImage (issue #319), which has to answer a second question the zip
      # does not: a file inside the image at a path the binary never looks at is still missing. So this
      # asserts both -- gamecontrollerdb.txt in the directory SDL_GetBasePath() resolves to, and the Qt
      # platform plugin on the search path qt.conf actually establishes -- as well as the libraries the
      # binary's own DT_NEEDED says it cannot start without.
      - name: Verify the archive
        run: python3 native/tools/verify-release-archive.py --kind appimage --archive EverythingBox-linux-x86_64.AppImage --repo .

      # Bundling libspeechd (issue #403) must not cost a start on the common Linux host, which has no
      # speech-dispatcher daemon. Two checks. First, the speechd plugin and the library it links are both in the
      # image and the plugin resolves libspeechd.so.2 to the BUNDLED copy through its own RPATH, not to the one
      # this runner installed to build with. Second, the AppImage itself is started headless with no daemon
      # installed and an empty runtime dir (so no speechd socket either), and must still be running when the
      # window has had 30 s, having logged startup.total -- the zero-timer after the first event-loop pass
      # following show(). The TTS plugin is only loaded when a book is read aloud, so a daemon-less start is
      # the property this pins; a missing daemon at that point is QTextToSpeech::Error, which ReadAloudController
      # already turns into a stop. The offscreen platform plugin is taken from the image when it is there and
      # otherwise from the SAME Qt install the image was deployed from (identical 6.8.3 build).
      - name: Smoke-start the AppImage (headless, no speech-dispatcher)
        run: |
          set -u   # NOT pipefail: a `grep | grep -q` below would fail on the very match it looks for
          if command -v speech-dispatcher >/dev/null 2>&1; then
            echo "::error::speech-dispatcher is installed on this runner, so this smoke cannot test its absence"
            exit 1
          fi
          rm -rf squashfs-root
          ./EverythingBox-linux-x86_64.AppImage --appimage-extract >/dev/null
          plugin=$(find "$PWD/squashfs-root" -name 'libqtexttospeech_speechd.so' | head -n1)
          bundled=$(find squashfs-root -name 'libspeechd.so.2*' | head -n1)
          if [ -z "$plugin" ] || [ -z "$bundled" ]; then
            echo "::error::speechd plugin ('$plugin') or libspeechd.so.2 ('$bundled') is missing from the AppImage"
            exit 1
          fi
          echo "bundled: $plugin"
          echo "bundled: $bundled"
          # Without install-qt-action's LD_LIBRARY_PATH (the build Qt): resolve the way a user's host would.
          env -u LD_LIBRARY_PATH ldd "$plugin" | tee plugin-ldd.txt
          if grep -q 'not found' plugin-ldd.txt; then
            echo "::error::the bundled speechd plugin has an unresolved dependency"; exit 1
          fi
          if ! grep 'libspeechd.so.2' plugin-ldd.txt | grep -q 'squashfs-root/'; then
            echo "::error::the speechd plugin resolves libspeechd.so.2 outside the image, so a host without it could not load it"
            exit 1
          fi

          smoke=$(mktemp -d)
          mkdir -p "$smoke/home" "$smoke/data" "$smoke/config" "$smoke/run"
          chmod 700 "$smoke/run"
          qpa_path=""
          if [ -z "$(find squashfs-root -name 'libqoffscreen.so' | head -n1)" ]; then
            qpa_path="$QT_ROOT_DIR/plugins/platforms"
            echo "offscreen platform plugin is not in the image; using $qpa_path (the Qt the image was deployed from)"
          fi
          rc=0
          # install-qt-action exported LD_LIBRARY_PATH / QT_PLUGIN_PATH / QML2_IMPORT_PATH at the build Qt; drop
          # them so the image runs on its own bundled Qt, as it would on a user's machine.
          env -u DBUS_SESSION_BUS_ADDRESS -u DISPLAY -u WAYLAND_DISPLAY \
              -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
              HOME="$smoke/home" XDG_DATA_HOME="$smoke/data" XDG_CONFIG_HOME="$smoke/config" \
              XDG_RUNTIME_DIR="$smoke/run" QT_QPA_PLATFORM=offscreen ${qpa_path:+QT_QPA_PLATFORM_PLUGIN_PATH="$qpa_path"} \
              EB_PERF=1 \
              timeout --kill-after=10 30 ./EverythingBox-linux-x86_64.AppImage > smoke.log 2>&1 || rc=$?
          pkill -f 'usr/bin/EverythingBox' || true   # the extract-and-run runtime may leave its child behind
          echo "--- AppImage output (tail) ---"
          tail -n 60 smoke.log
          trace=$(find "$smoke" -name perf_trace.log | head -n1)
          if [ -n "$trace" ]; then echo "--- $trace ---"; grep 'startup' "$trace" || true; fi
          if [ "$rc" -ne 124 ]; then
            echo "::error::the AppImage exited (rc=$rc) inside the 30 s smoke window instead of staying up"
            exit 1
          fi
          if [ -z "$trace" ] || ! grep -q 'startup.total' "$trace"; then
            echo "::error::no startup.total in perf_trace.log -- the window never reached its first event-loop pass"
            exit 1
          fi
          echo "AppImage started headless with no speech-dispatcher and was still running at 30 s"

      # Issue #341: the user's data lives in $XDG_DATA_HOME/EverythingBox and AssetBootstrap seeds it, because
      # inside an AppImage the binary's own directory is a READ-ONLY squashfs mount. The smoke above runs
      # extract-and-run (the job sets APPIMAGE_EXTRACT_AND_RUN for linuxdeploy), where the "app dir" is a
      # writable squashfs-root and so proves nothing about that. This step runs the image the way a user's
      # desktop does -- the runtime FUSE-mounts it read-only under /tmp/.mount_* -- twice, against one fresh set
      # of XDG dirs, and asserts from the process table, the mount table and the app's own log that:
      #   run 1 ran from the mount, was a first launch (onboarding shown), wrote everythingbox.ini and the
      #         seeded themes2/ + addons/ + .assets-version stamp into XDG, and logged no write failure;
      #   run 2, after a real Settings > Debug key (debug/uiTestChannel) is written into that ini, read the key
      #         at startup (the UI-test channel comes up with EB_UITEST unset), kept what run 1 wrote, did not
      #         re-extract the bundled assets and did not show onboarding.
      # Same offscreen / no-daemon / no-build-Qt environment as the smoke above.
      - name: Persist state across two launches of the FUSE-mounted AppImage
        run: |
          # The default step shell is `bash -e`; every check below is explicit, and a non-zero `wait` or a failed
          # probe of a not-yet-listening channel must be READ, not end the step without a word.
          set +e -u
          fail() { echo "::error::$*"; exit 1; }
          image="$PWD/EverythingBox-linux-x86_64.AppImage"
          [ -d squashfs-root/usr/bin ] || fail "squashfs-root from the smoke step is missing"
          # The type2 runtime links libfuse 3 and needs a fusermount of major version 3 (fuse2's alone is refused).
          if ! command -v fusermount3 >/dev/null 2>&1; then
            echo "no fusermount3 on PATH; installing fuse3 so the AppImage runtime can mount"
            sudo apt-get install -y --no-install-recommends fuse3 >/dev/null || fail "could not install fuse3"
          fi
          echo "fusermount: $(command -v fusermount3 || true) $(command -v fusermount || true)"
          ls -l /dev/fuse || fail "/dev/fuse is absent: this runner cannot FUSE-mount"
          ./EverythingBox-linux-x86_64.AppImage --appimage-version 2>&1 | head -n1
          image_sha_before=$(sha256sum "$image" | cut -d' ' -f1)

          app_version=$(sed -n 's/.*kAppVersion = "\([^"]*\)".*/\1/p' native/src/main.cpp | head -n1)
          [ -n "$app_version" ] || fail "could not read kAppVersion from native/src/main.cpp"
          qpa_path=""
          if [ -z "$(find squashfs-root -name 'libqoffscreen.so' | head -n1)" ]; then
            qpa_path="$QT_ROOT_DIR/plugins/platforms"
          fi
          p=$(mktemp -d)
          mkdir -p "$p/home" "$p/data" "$p/config" "$p/run"
          chmod 700 "$p/run"
          data="$p/data/EverythingBox"
          ini="$data/everythingbox.ini"
          log="$data/stream_debug.log"
          export EB_UITEST_PIPE="eb341-$$"      # uitest.py and the app both honour it; /tmp/<name> on Linux
          uit() { EB_UITEST_TIMEOUT=5 python3 native/tools/uitest.py "$@"; }
          field() { python3 -c 'import json,sys; print(json.load(sys.stdin).get(sys.argv[1], ""))' "$1"; }
          # One key of the QSettings ini, read by section so a same-named key elsewhere cannot answer for it.
          inival() {
            python3 -c '
          import configparser, sys
          c = configparser.ConfigParser(interpolation=None, strict=False)
          c.optionxform = str
          c.read(sys.argv[1], encoding="utf-8")
          print(c.get(sys.argv[2], sys.argv[3], fallback=""))' "$ini" "$1" "$2" 2>/dev/null
          }
          fsig() { stat -c 'inode=%i mtime=%Y ctime=%Z' "$1"; }

          # $1 = run label; $2 = "uitest" to set EB_UITEST=1 (run 1 only). APPIMAGE_EXTRACT_AND_RUN is UNSET, so
          # the runtime mounts the image instead of extracting it.
          launch() {
            extra=""; [ "$2" = uitest ] && extra="EB_UITEST=1"
            env -u APPIMAGE_EXTRACT_AND_RUN -u EB_UITEST \
                -u DBUS_SESSION_BUS_ADDRESS -u DISPLAY -u WAYLAND_DISPLAY \
                -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
                HOME="$p/home" XDG_DATA_HOME="$p/data" XDG_CONFIG_HOME="$p/config" \
                XDG_RUNTIME_DIR="$p/run" QT_QPA_PLATFORM=offscreen ${qpa_path:+QT_QPA_PLATFORM_PLUGIN_PATH="$qpa_path"} \
                EB_PERF=1 EB_UITEST_PIPE="$EB_UITEST_PIPE" $extra \
                timeout --kill-after=10 30 "$image" > "$p/$1.out" 2>&1 &
            tpid=$!
            # The app need not be timeout's direct child: on the runner an AppImage runtime process sits between
            # them (the chain is printed below). Take whichever child or grandchild is the EverythingBox binary.
            app=""
            for _ in $(seq 1 40); do
              for c in $(pgrep -P "$tpid") $(for k in $(pgrep -P "$tpid"); do pgrep -P "$k"; done); do
                if readlink "/proc/$c/exe" 2>/dev/null | grep -q '/usr/bin/EverythingBox$'; then app=$c; break; fi
              done
              [ -n "$app" ] && break
              sleep 0.5
            done
            if [ -z "$app" ]; then
              ps -o pid,ppid,args --ppid "$tpid" || true
              tail -n 40 "$p/$1.out"
              fail "$1: no EverythingBox process appeared under the AppImage runtime"
            fi
          }

          # Evidence that THIS process runs from a read-only FUSE mount of the image, not an extracted tree.
          assert_mounted() {
            exe=$(readlink "/proc/$app/exe")
            echo "$1: /proc/$app/exe -> $exe"
            case "$exe" in
              /tmp/.mount_*/usr/bin/EverythingBox) ;;
              *) fail "$1: the app is not running from a /tmp/.mount_* FUSE mount (exe=$exe)" ;;
            esac
            case "$exe" in *squashfs-root*|*appimage_extracted*) fail "$1: exe is an extracted tree ($exe)" ;; esac
            mnt=${exe%/usr/bin/EverythingBox}
            line=$(awk -v m="$mnt" '$2 == m' /proc/mounts)
            echo "$1: /proc/mounts: $line"
            [ -n "$line" ] || fail "$1: $mnt is not in the mount table"
            echo "$line" | awk '{print $3}' | grep -q '^fuse' || fail "$1: $mnt is not a FUSE mount"
            echo "$line" | awk '{print $4}' | tr ',' '\n' | grep -qx ro || fail "$1: $mnt is not mounted read-only"
            if tr '\0' '\n' < "/proc/$app/environ" | grep -q '^APPIMAGE_EXTRACT_AND_RUN='; then
              fail "$1: APPIMAGE_EXTRACT_AND_RUN is set in the app's environment"
            fi
            echo "$1: app environment: $(tr '\0' '\n' < "/proc/$app/environ" | grep -E '^(APPDIR|APPIMAGE)=' | tr '\n' ' ')"
            if touch "$mnt/usr/bin/.eb341-write-test" 2> "$p/touch.err"; then
              fail "$1: a write under the mount succeeded; it is not read-only"
            fi
            echo "$1: write under the mount refused: $(cat "$p/touch.err")"
            echo "$1: app signal masks: $(grep -E '^Sig(Blk|Ign)' "/proc/$app/status" | tr -s '[:space:]' ' ')"
            mid=$(ps -o ppid= -p "$app" | tr -d ' ')
            echo "$1: process chain: timeout $tpid -> $mid ($(readlink "/proc/$mid/exe" 2>/dev/null)) -> app $app"
          }

          # $1 = run label. The app must still be up when its drive is done, i.e. it did not exit on its own inside
          # the window; then the 30 s timeout ends the run. The process chain printed above shows the app is
          # timeout's DIRECT child (the runtime execs it). rc 124 = the app exited after SIGTERM. rc 137 = it was
          # still running 10 s after SIGTERM, so timeout sent SIGKILL. Today the Linux app does not quit on SIGTERM,
          # so 137 is the usual answer; that is a separate app bug, not a smoke failure. Either way the timeout ended
          # the run; anything else is an exit of its own.
          finish() {
            kill -0 "$app" 2>/dev/null || { tail -n 40 "$p/$1.out"; fail "$1: the app exited on its own inside its 30 s window"; }
            wait "$tpid"; rc=$?
            pkill -f '/usr/bin/EverythingBox' || true
            echo "$1: the 30 s timeout ended the run (rc=$rc)"
            case "$rc" in
              124|137) ;;
              *) tail -n 40 "$p/$1.out"; fail "$1: the AppImage exited with rc=$rc instead of being stopped by the timeout" ;;
            esac
          }

          wait_ready() {
            for _ in $(seq 1 40); do
              [ "$(uit status 2>/dev/null)" = "ok ready" ] && return 0
              sleep 0.5
            done
            return 1
          }
          # "ready" means the window exists; the first screen is presented a tick after show (MainWindow::showEvent's
          # zero-timer), so wait for it to carry a title rather than racing it.
          wait_title() {
            title=""
            for _ in $(seq 1 40); do
              title=$(uit state 2>/dev/null | field panelTitle 2>/dev/null)
              [ -n "$title" ] && return 0
              sleep 0.5
            done
            return 1
          }

          # Unwritable-directory failures the app would hit if it still wrote beside its binary.
          write_failures() { grep -n -E 'AccessError|Read-only file system|EROFS' "$log" "$p/$1.out" || true; }

          # ------------------------------------------------------------------ run 1: first launch
          [ ! -e "$data" ] || fail "the fresh data dir already exists"
          launch run1 uitest
          wait_ready || { tail -n 40 "$p/run1.out"; fail "run1: the UI-test channel never reported ready"; }
          assert_mounted run1
          wait_title || true
          state1=$(uit state)
          title1=$(printf '%s' "$state1" | field panelTitle)
          echo "run1: first screen panelTitle='$title1' page='$(printf '%s' "$state1" | field page)'"
          # The first-run choice screen (MainWindow::onboardingChoiceTitle). Seeing it here is the control that
          # makes run 2's "not shown" mean something.
          [ "$title1" = "Welcome to EverythingBox" ] || { echo "$state1"; fail "run1: a fresh data dir did not show onboarding"; }
          # Answer it the way a user does -- row 2, "Set up a new library" -- so the APP writes onboarding/done.
          focus1=""
          for _ in 1 2 3; do
            case "$focus1" in *"new library"*) break ;; esac
            uit key down >/dev/null
            sleep 0.5
            focus1=$(uit state | field panelFocus)
            echo "run1: onboarding focus='$focus1'"
          done
          case "$focus1" in *"new library"*) ;; *) fail "run1: expected 'Set up a new library' focused, got '$focus1'" ;; esac
          uit key enter >/dev/null
          for _ in $(seq 1 20); do [ "$(inival onboarding done)" = true ] && break; sleep 0.5; done
          echo "run1: after choosing a new library panelTitle='$(uit state | field panelTitle)'"
          finish run1

          echo "--- run 1 wrote into $data ---"
          ls -la "$data"
          [ -f "$ini" ] || fail "run1: no everythingbox.ini in \$XDG_DATA_HOME/EverythingBox"
          [ -f "$log" ] || fail "run1: no stream_debug.log in \$XDG_DATA_HOME/EverythingBox (the app's log handler writes to dataDir)"
          echo "run1: everythingbox.ini [onboarding] done=$(inival onboarding done)"
          [ "$(inival onboarding done)" = true ] || fail "run1: the app did not persist onboarding/done=true"
          stamp="$data/.assets-version"
          [ -f "$stamp" ] || fail "run1: AssetBootstrap wrote no .assets-version stamp"
          echo "run1: .assets-version = '$(cat "$stamp")' (app $app_version)"
          [ "$(cat "$stamp")" = "$app_version" ] || fail "run1: the stamp does not name this build's version"
          for d in themes2 addons; do
            want=$(ls squashfs-root/usr/bin/$d | sort | tr '\n' ' ')
            got=$(ls "$data/$d" 2>/dev/null | sort | tr '\n' ' ')
            echo "run1: $d in image: $want"
            echo "run1: $d in XDG:   $got"
            # Every stock entry must have arrived; the app may add its own beside them (addons/_storage).
            missing=""
            for e in $want; do [ -e "$data/$d/$e" ] || missing="$missing $e"; done
            [ -n "$want" ] && [ -z "$missing" ] || fail "run1: $data/$d lacks the image's stock$missing"
          done
          echo "run1: themes2 and addons in XDG hold every stock entry the image ships"
          extracted=$(grep -c 'AssetBootstrap: extracted assets from /tmp/.mount_' "$log")
          grep 'AssetBootstrap: extracted assets from' "$log"
          [ "$extracted" -eq 1 ] || fail "run1: expected one AssetBootstrap extraction from the mount, logged $extracted"
          wf=$(write_failures run1)
          [ -z "$wf" ] || { echo "$wf"; fail "run1: the app logged a write failure"; }
          echo "run1: no AccessError / read-only write failure in stream_debug.log or the app's output"
          stamp_sig=$(fsig "$stamp")
          theme_file=$(find "$data/themes2" -name theme.json | sort | head -n1)
          theme_sig=$(fsig "$theme_file")
          echo "run1: .assets-version $stamp_sig; $theme_file $theme_sig"
          sleep 2   # so a rewrite in run 2 could not land in the same second as run 1's copy

          # ------------------------------------------------------------------ between runs
          for _ in $(seq 1 20); do grep -q '/tmp/.mount_' /proc/mounts || break; sleep 0.5; done
          # A real key the app reads at startup: Settings::uiTestChannel() == debug/uiTestChannel, consulted by
          # UiTestServer::ensureListening(IniPhase::Settled) once the ini is settled. Its visible effect is the
          # control channel listening although run 2 has neither EB_UITEST nor --uitest.
          python3 - "$ini" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          if "[debug]" in text.splitlines():
              lines = text.splitlines()
              lines.insert(lines.index("[debug]") + 1, "uiTestChannel=true")
              text = "\n".join(lines) + "\n"
          else:
              text = text.rstrip("\n") + "\n\n[debug]\nuiTestChannel=true\n"
          open(path, "w", encoding="utf-8").write(text)
          PY
          echo "between runs: wrote [debug] uiTestChannel=true into $ini"

          # ------------------------------------------------------------------ run 2: second launch
          launch run2 plain
          if ! wait_ready; then
            tail -n 40 "$p/run2.out"
            fail "run2: the UI-test channel never came up, so the persisted debug/uiTestChannel was not read"
          fi
          echo "run2: UI-test channel answered 'ok ready' with EB_UITEST unset -> debug/uiTestChannel was read from the persisted ini"
          assert_mounted run2
          wait_title || true
          state2=$(uit state)
          title2=$(printf '%s' "$state2" | field panelTitle)
          echo "run2: first screen panelTitle='$title2' page='$(printf '%s' "$state2" | field page)'"
          [ "$title2" != "Welcome to EverythingBox" ] || fail "run2: onboarding was shown again"
          # onboarding/done=true routes showEvent to promptStartupProfile(), whose themed title is this.
          [ "$title2" = "Who's using EverythingBox?" ] || { echo "$state2"; fail "run2: expected the profile picker, got '$title2'"; }
          finish run2

          echo "run2: everythingbox.ini [debug] uiTestChannel=$(inival debug uiTestChannel) [onboarding] done=$(inival onboarding done)"
          [ "$(inival debug uiTestChannel)" = true ] || fail "run2: debug/uiTestChannel did not survive in the ini"
          [ "$(inival onboarding done)" = true ] || fail "run2: onboarding/done did not survive in the ini"
          echo "run2: .assets-version $(fsig "$stamp"); $theme_file $(fsig "$theme_file")"
          [ "$(fsig "$stamp")" = "$stamp_sig" ] || fail "run2: .assets-version was rewritten (first-run extraction ran again)"
          [ "$(fsig "$theme_file")" = "$theme_sig" ] || fail "run2: $theme_file was re-copied (first-run extraction ran again)"
          extracted=$(grep -c 'AssetBootstrap: extracted assets from' "$log")
          [ "$extracted" -eq 1 ] || fail "run2: AssetBootstrap extracted again ($extracted extraction lines in the log)"
          echo "run2: .assets-version and $(basename "$(dirname "$theme_file")")/theme.json untouched (inode, mtime, ctime), still exactly 1 AssetBootstrap extraction logged"
          wf=$(write_failures run2)
          [ -z "$wf" ] || { echo "$wf"; fail "run2: the app logged a write failure"; }
          [ "$(sha256sum "$image" | cut -d' ' -f1)" = "$image_sha_before" ] || fail "the AppImage file changed across the runs"
          echo "run2: no write failure logged; the AppImage is byte-identical after both runs"
          echo "--- $data/perf_trace.log (both runs) ---"
          grep 'startup.total' "$data/perf_trace.log"
          [ "$(grep -c 'startup.total' "$data/perf_trace.log")" -eq 2 ] || fail "expected startup.total from exactly two launches in perf_trace.log"
          echo "AppImage kept its state across two FUSE-mounted launches"

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBox-linux-x86_64
          path: EverythingBox-linux-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EverythingBox-linux-x86_64.AppImage
          generate_release_notes: true

  # ---------------------------------------------------------------- Android ---
  # Android / Android TV APK. Self-provisioning: pulls a prebuilt libmpv (+ ffmpeg) from Maven Central
  # and the mpv headers from the mpv repo, then qt-cmake -> androiddeployqt -> APK.
  # Matrixed over arm64-v8a (real devices / TV) and x86_64 (emulator). The jdtech AAR ships .so's for
  # both ABIs (verified: jni/arm64-v8a/ and jni/x86_64/ both carry libmpv.so + the full libav stack).
  # See native/docs/android-port.md.
  android:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: android_arm64_v8a
            jni_abi: arm64-v8a
            name: arm64
          - qt_arch: android_x86_64
            jni_abi: x86_64
            name: x86_64
          - qt_arch: android_armv7
            jni_abi: armeabi-v7a
            name: armv7
    env:
      QT_ANDROID_ARCH: ${{ matrix.qt_arch }}
      NDK_VERSION: '26.1.10909125'   # Qt 6.8's recommended NDK (r26b)
      # Release-signing secrets (empty on forks/PRs -> build stays unsigned). Mapped here so step-level
      # `if` guards can test presence without referencing the secrets context directly.
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # An explicit package list. The action's default asks for the legacy 'tools' package, which cmdline-tools
      # 16.0 no longer provides, and a missing package is fatal (#405). platforms;android-34 matches
      # QT_ANDROID_TARGET_SDK_VERSION in native/CMakeLists.txt; the NDK is Qt 6.8's r26b (NDK_VERSION above).
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'
      - name: Point the build at the NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Host Qt (tools: moc/rcc/androiddeployqt run on the runner) ...
      - name: Install Qt (host desktop)
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtdeclarative (QtQml/QtQuick) is an ESSENTIAL bundled in the Qt base install — aqt rejects it as
          # an add-on module ("packages ['qtdeclarative'] were not found"). Only genuine add-ons go here.
          modules: 'qtmultimedia qtpdf qtspeech'
          cache: true
      - name: Remember host Qt
        run: echo "QT_HOST_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      # ... and the Android Qt (per-ABI) that we actually link against.
      - name: Install Qt (Android ${{ matrix.name }})
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ${{ env.AQT_VERSION }}
          py7zrversion: ${{ env.PY7ZR_VERSION }}
          # Qt 6.7+ publishes Android kits under all_os/android on download.qt.io; linux_x64/android stops at
          # 6.7.3, so `host: linux` cannot resolve 6.8.3 on a cold install (#405).
          host: all_os
          target: android
          arch: ${{ env.QT_ANDROID_ARCH }}
          # QtPdf isn't published for Android (PdfView is stubbed there); qtdeclarative (QtQuick/QtQml) is a
          # base essential, not an aqt add-on module, so it must NOT be listed here either.
          modules: 'qtmultimedia'
          cache: true

      # Qt Multimedia's FFmpeg *media plugin* DT_NEEDs Qt's OWN libav*/libsw* — a DIFFERENT FFmpeg build than
      # the jdtech libmpv AAR's. Both sets share sonames, so only one of each can land in the APK's lib/<abi>/.
      # In practice jdtech wins libavcodec/util/sw*/avdevice but Qt wins libavformat.so — and jdtech's
      # libavdevice.so then can't bind avpriv_register_devices against Qt's libavformat, so the process dies
      # with UnsatisfiedLinkError in QtLoader BEFORE main() (see d2-task-6 report). Fix: remove Qt's FFmpeg
      # plugin + libs from the kit so androiddeployqt bundles ONLY jdtech's matched FFmpeg set (libmpv then
      # binds a single coherent build). QtMultimedia stays fully functional via the Android (OpenSL ES / Media
      # Codec) backend — QAudioSink emulator audio, QSoundEffect menu SFX and QMediaDevices need no FFmpeg; all
      # app media decode goes through libmpv regardless. No QMediaPlayer/FFmpeg-decode path is used on Android.
      - name: Drop Qt Multimedia's FFmpeg backend (SONAME clash with libmpv's FFmpeg)
        run: |
          set -e
          KIT="$QT_ROOT_DIR"
          echo "Pruning Qt FFmpeg backend from kit: $KIT"
          # 1) The FFmpeg media plugin .so itself.
          echo "--- ffmpeg media plugin(s):"
          find "$KIT" -name '*ffmpegmediaplugin*' -print -delete || true
          # 2) Its CMake package files. find_package(Qt6 Multimedia) auto-includes every
          #    lib/cmake/Qt6Multimedia/Qt6*PluginConfig.cmake (file(GLOB)+include) and declares an IMPORTED
          #    target whose IMPORTED_LOCATION is the plugin .so — configure hard-fails if that .so is gone.
          #    Removing the plugin's *Config.cmake drops it from the glob, so the target is never declared.
          echo "--- ffmpeg plugin CMake package files:"
          find "$KIT" -path '*cmake/Qt6Multimedia/*QFFmpegMediaPlugin*' -print -delete || true
          # 3) Qt's own libav*/libsw* (a different FFmpeg build than jdtech's; sonames collide in the APK).
          echo "--- Qt-bundled libav*/libsw*:"
          find "$KIT" \( -name 'libav*.so' -o -name 'libsw*.so' \) -print -delete || true
          echo "--- remaining ffmpeg artifacts in kit (expect none):"
          LEFT=$(find "$KIT" \( -name '*ffmpegmediaplugin*' -o -name 'libav*.so' -o -name 'libsw*.so' -o -path '*QFFmpegMediaPlugin*' \) -print)
          if [ -n "$LEFT" ]; then
            echo "$LEFT"
            echo "FATAL: Qt FFmpeg artifacts survived the prune (would clash with libmpv's FFmpeg in the APK)"
            exit 1
          fi
          echo "(none)"

      - name: Provide libmpv for Android
        env:
          # Prebuilt libmpv (+ its ffmpeg stack) from the Jellyfin/jdtech AAR on Maven Central, and matching
          # public mpv headers (the AAR ships none). The AAR carries per-ABI jni/ dirs; we pull the one for
          # this matrix ABI. Override LIBMPV_AAR_URL via a repo variable to pin a different prebuilt.
          LIBMPV_AAR_URL: ${{ vars.LIBMPV_AAR_URL || 'https://repo1.maven.org/maven2/dev/jdtech/mpv/libmpv/1.0.0/libmpv-1.0.0.aar' }}
          MPV_HEADERS_TAG: 'v0.40.0'
          JNI_ABI: ${{ matrix.jni_abi }}
        run: |
          set -e
          curl -fL "$LIBMPV_AAR_URL" -o libmpv.aar
          mkdir -p mpv-android/libs mpv-android/include/mpv
          unzip -o -j libmpv.aar "jni/${JNI_ABI}/*.so" -d mpv-android/libs
          # libplayer.so is jdtech's JNI wrapper (unused) - drop it. libmpv.so + the libav*/libsw* deps ride along.
          rm -f mpv-android/libs/libplayer.so
          # libc++: jdtech built libmpv against a NEWER libc++ than Qt's NDK (r26b, LLVM 17) ships — libmpv.so
          # imports std::__ndk1::__from_chars_floating_point<float>, absent from r26b's libc++_shared.so, which
          # crashed the app at libmpv load (UnsatisfiedLinkError, before main). libc++ is forward-compatible and
          # (verified against the built APK) jdtech's libc++ defines every libc++ symbol the Qt/app/mpv libs
          # reference, so REPLACE the NDK runtime libc++_shared.so that androiddeployqt bundles with jdtech's.
          # Then drop jdtech's from mpv-android/libs so EXTRA_LIBS doesn't also add it (same soname -> collision).
          case "$JNI_ABI" in
            x86_64)     TRIPLE=x86_64-linux-android ;;
            arm64-v8a)  TRIPLE=aarch64-linux-android ;;
            armeabi-v7a) TRIPLE=arm-linux-androideabi ;;
            *) echo "unknown ABI $JNI_ABI"; exit 1 ;;
          esac
          NDK_LIBCXX=$(find "$ANDROID_NDK_ROOT" -path "*/$TRIPLE/libc++_shared.so" | head -1)
          [ -n "$NDK_LIBCXX" ] || { echo "NDK libc++_shared.so not found for $TRIPLE"; exit 1; }
          # Assert the swap DIRECTION before clobbering the NDK runtime. __from_chars_floating_point is the
          # discriminating symbol: libmpv imports it and the crash was the NDK's libc++_shared.so not exporting
          # it. Decide from the symbol tables (llvm-nm -D, grep -a fallback) rather than assuming jdtech's is
          # always newer:
          #   - NDK already exports it        -> NDK libc++ is new enough; keep it, drop jdtech's copy.
          #   - NDK lacks it, jdtech's has it -> replace the bundled NDK runtime with jdtech's newer build.
          #   - neither exports it            -> assumption is stale; FAIL loudly instead of shipping a crash.
          DISCRIM_SYM=__from_chars_floating_point
          NM=$(find "$ANDROID_NDK_ROOT" \( -name 'llvm-nm' -o -name 'llvm-nm.exe' \) 2>/dev/null | head -1)
          has_sym() { # $1 = path to a .so
            if [ -n "$NM" ]; then "$NM" -D "$1" 2>/dev/null | grep -q "$DISCRIM_SYM"
            else grep -aq "$DISCRIM_SYM" "$1"; fi
          }
          if has_sym "$NDK_LIBCXX"; then
            echo "NDK libc++ ($NDK_LIBCXX) already exports $DISCRIM_SYM — no swap needed"
            rm -f mpv-android/libs/libc++_shared.so
          elif has_sym mpv-android/libs/libc++_shared.so; then
            echo "NDK libc++ lacks $DISCRIM_SYM; jdtech's provides it — replacing NDK runtime ($NDK_LIBCXX)"
            cp -f mpv-android/libs/libc++_shared.so "$NDK_LIBCXX"
            rm -f mpv-android/libs/libc++_shared.so
          else
            echo "FATAL: neither the NDK nor jdtech's libc++_shared.so exports $DISCRIM_SYM — libc++ swap assumption is stale"
            exit 1
          fi
          ls -la mpv-android/libs
          for h in client.h render.h render_gl.h stream_cb.h; do
            curl -fsSL "https://raw.githubusercontent.com/mpv-player/mpv/${MPV_HEADERS_TAG}/include/mpv/$h" \
              -o "mpv-android/include/mpv/$h"
          done
          echo "MPV_LIBRARY=$(realpath mpv-android/libs/libmpv.so)" >> "$GITHUB_ENV"
          echo "MPV_INCLUDE_DIR=$(realpath mpv-android/include)" >> "$GITHUB_ENV"

      # OpenSSL runtime for Android TLS. The APK bundles Qt's OpenSSL *plugin*
      # (libplugins_tls_qopensslbackend) but NOT a per-ABI libssl/libcrypto, so on-device Qt's dlopen of the
      # system /system/lib*/libcrypto.so is namespace-denied by Android's linker ("... is not accessible for
      # the namespace") and every HTTPS request dies with "No TLS backend is available" — zero addon content,
      # metadata, or downloads (verified on armv7 TV, but ALL THREE ABIs ship the same gap; this fetch is
      # matrixed so arm64 + x86_64 are fixed by the same leg). Fix: bundle KDAB's prebuilt OpenSSL 3 .so's
      # (ssl_3 matches Qt 6.8's OpenSSL 3) for THIS ABI into the APK's lib/<abi>/ via QT_ANDROID_EXTRA_LIBS
      # (the same mechanism libmpv rides), so Qt's TLS backend loads them from the app's own linker namespace.
      - name: Provide OpenSSL for Android (per-ABI libssl/libcrypto)
        env:
          JNI_ABI: ${{ matrix.jni_abi }}
        run: |
          set -e
          git clone --depth 1 https://github.com/KDAB/android_openssl.git android_openssl
          SSL_DIR="android_openssl/ssl_3/${JNI_ABI}"
          [ -d "$SSL_DIR" ] || { echo "No OpenSSL 3 prebuilts for ABI $JNI_ABI at $SSL_DIR"; ls android_openssl/ssl_3 || true; exit 1; }
          echo "--- bundling OpenSSL for $JNI_ABI:"; ls -la "$SSL_DIR"
          echo "OPENSSL_ANDROID_LIBS_DIR=$(realpath "$SSL_DIR")" >> "$GITHUB_ENV"

      # Release signing (Qt 6.8 androiddeployqt env route): decode the persistent EverythingBox release keystore
      # to the runner and expose QT_ANDROID_SIGN_APK + keystore path/alias/store+key pass via $GITHUB_ENV, so the
      # `apk` build target signs the release APK with the release key. Guarded on the secret being present — forks
      # and PRs from forks (no secrets) skip this and still build an *unsigned* release APK. The passwords come
      # from secrets, so GitHub auto-masks them in logs; the password is alphanumeric (no `=`/newline) so the
      # KEY=VALUE env-file lines are safe.
      - name: Set up release signing
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/eb-release.keystore"
          # QT_ANDROID_SIGN_APK is a *CMake configure* variable (not an env var) — passed to qt-cmake below via
          # $QT_ANDROID_SIGN_CMAKE so the androiddeployqt build rule is generated with --sign. The keystore
          # PATH/ALIAS/STORE_PASS/KEY_PASS are the env vars androiddeployqt reads at build time. Passwords come
          # from secrets (auto-masked) and are alphanumeric, so the KEY=VALUE env-file lines are safe.
          {
            echo "QT_ANDROID_SIGN_CMAKE=-DQT_ANDROID_SIGN_APK=ON"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/eb-release.keystore"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEY_ALIAS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$ANDROID_KEYSTORE_PASS"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$ANDROID_KEYSTORE_PASS"
          } >> "$GITHUB_ENV"
          echo "Release signing enabled (alias: $ANDROID_KEY_ALIAS)."

      - name: Configure (qt-cmake)
        run: |
          # A freshly aqt-extracted Android kit (no prior cache — e.g. the armv7 ABI) can land qt-cmake
          # without its execute bit, so the wrapper dies with "Permission denied" (exit 126). Cached kits
          # keep perms from the tarball, so this is a no-op for them. Restore +x before invoking.
          chmod +x "$QT_ROOT_DIR/bin/"* 2>/dev/null || true
          # CMAKE_BUILD_TYPE=Release makes androiddeployqt build a *release* APK (the prerequisite for
          # QT_ANDROID_SIGN_APK to sign it; a Debug/unset build would emit a debug-signed APK instead).
          # $QT_ANDROID_SIGN_CMAKE is '-DQT_ANDROID_SIGN_APK=ON' when the signing step ran (secrets present),
          # and empty (expands to no argument) on forks/PRs without the keystore secret -> unsigned release build.
          "$QT_ROOT_DIR/bin/qt-cmake" -S native -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            $QT_ANDROID_SIGN_CMAKE \
            -DQT_HOST_PATH="$QT_HOST_ROOT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DEVERYTHINGBOX_BUILD_APP=ON \
            -DMPV_INCLUDE_DIR="$MPV_INCLUDE_DIR" \
            -DMPV_LIBRARY="$MPV_LIBRARY" \
            -DOPENSSL_ANDROID_LIBS_DIR="$OPENSSL_ANDROID_LIBS_DIR"
          # SDL2-for-Android (gamepad) is optional; omitted here, so the first APK builds without controller input.

      - name: Build APK
        run: cmake --build build-android

      - name: Collect APK
        env:
          ABI_NAME: ${{ matrix.name }}
        run: |
          # Prefer the SIGNED release APK; then a non-'unsigned' release/debug APK; then anything.
          apk=$(find build-android -name '*-signed.apk' | head -n1)
          [ -n "$apk" ] || apk=$(find build-android -name '*.apk' | grep -iE 'release|debug' | grep -vi 'unsigned' | head -n1)
          [ -n "$apk" ] || apk=$(find build-android -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo "No APK produced"; find build-android -name '*.apk' -o -name '*.aab'; exit 1; }
          cp "$apk" "EverythingBox-android-${ABI_NAME}.apk"
          echo "Collected APK: $apk"
          ls -la "EverythingBox-android-${ABI_NAME}.apk"
          # Sanity: the staged assets and the qtdeclarative/mpv .so's must actually be inside the APK.
          echo "=== APK assets/eb (expect themes2 + addons) ==="; unzip -l "EverythingBox-android-${ABI_NAME}.apk" | grep -E 'assets/eb' | head -20 || true
          echo "=== APK libs (expect libmpv + libQt6Quick) ==="; unzip -l "EverythingBox-android-${ABI_NAME}.apk" | grep -E 'lib/.*(libmpv|Qt6Quick|Qt6Qml)' | head -20 || true
          echo "=== APK OpenSSL (expect libssl + libcrypto — TLS) ==="
          if ! unzip -l "EverythingBox-android-${ABI_NAME}.apk" | grep -E 'lib/.*(libssl|libcrypto)'; then
            echo "FATAL: no libssl/libcrypto bundled — TLS would be dead on device (F2)"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: EverythingBox-android-${{ matrix.name }}
          path: EverythingBox-android-${{ matrix.name }}.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EverythingBox-android-${{ matrix.name }}.apk
          generate_release_notes: true
