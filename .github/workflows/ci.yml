name: CI (headless probes)

# Fast, display-less regression tests that run on every push/PR — not just releases. Builds the standalone
# probe harnesses and runs the headless "emulator" suite: two-instance netplay lockstep (relay + the "Both"
# UPnP-direct/relay-fallback orchestration) and, best-effort, a real libretro core load. See
# native/tools/run-headless-probes.sh.
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.gitmodules'
      - 'external/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.gitmodules'
      - 'external/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  headless-probes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake python3 \
            libmpv-dev libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev libpulse-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtpdf'
          cache: true

      # librashader (issue #99) is built from Rust source via corrosion during Configure/Build, so the gate
      # needs a Rust toolchain on PATH before CMake runs. Minimal: stable, default host target (the CI runner
      # is x86_64 Linux, so librashader-capi's non-Windows backends are what compile; NO_DEFAULT_FEATURES in
      # native/CMakeLists.txt keeps even those off for this slice).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: |
          cmake -S native -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVERYTHINGBOX_BUILD_APP=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      # Build ONLY the probe harnesses (not the whole app) — this is a test job, so keep it quick.
      - name: Build probes
        run: cmake --build build --target probe_core probe_netplay probe_netplay_both probe_nav probe_navqml probe_themeview probe_meta probe_addon probe_gameagg probe_gamelist probe_notifier probe_m3u probe_discgroup probe_regioncollapse probe_playback probe_browse probe_leafroute probe_perf probe_formfactor probe_bootstrap probe_sync probe_extplayer probe_marks probe_bookmarks probe_audiobookmarks probe_opds probe_tar probe_launchopts probe_emutargets probe_emulation_scope probe_pcscan probe_emusettings probe_shaderpreset probe_librashader probe_shaderchain probe_shaderassets probe_deviceprofile probe_pad2key probe_seats probe_launchhooks probe_filterpreset probe_hwdecode probe_hardcore probe_substyle probe_readertypography probe_refreshsync probe_hdroutput probe_replaygain probe_crossfade probe_audioout probe_contentlang probe_softpatch probe_romhack probe_overrides probe_hashverify probe_stats probe_playlists probe_photos probe_iptv probe_xmltv probe_cloudmerge probe_importers probe_onboarding probe_locallib probe_resolver probe_showdispatch probe_subs probe_segments probe_listening probe_lyrics probe_lyricseek probe_lyricsources probe_musictags probe_musiclibrary probe_musicbrowse probe_musicqueue probe_stremio probe_savesync probe_serversync probe_brand probe_theme probe_settingstxn probe_trakt probe_passcode probe_pcgames probe_crashreport probe_isolation probe_uitest probe_themereg probe_miximage probe_attract probe_manual probe_stateslots probe_bezel probe_cheatsearch probe_remoteapi probe_syscatalog probe_romrouting probe_archiverom probe_useremulators probe_bulkselect probe_comicfit probe_retropark_input probe_coreopts probe_ps3update probe_ps3firmware probe_launchcancel probe_launchcontexts

      # Best-effort: grab a small real libretro core so the suite can prove the frontend can load one. If the
      # external buildbot is unavailable the suite just skips this check (it's advisory, never gates CI).
      - name: Fetch a libretro core (optional)
        continue-on-error: true
        run: |
          url="https://buildbot.libretro.com/nightly/linux/x86_64/latest/mgba_libretro.so.zip"
          if curl -fsSL "$url" -o core.zip; then
            unzip -o core.zip -d core
            so="$(find core -name '*_libretro.so' | head -n1)"
            [ -n "$so" ] && echo "CORE_SO=$(realpath "$so")" >> "$GITHUB_ENV"
          else
            echo "core download unavailable; the core-load probe will be skipped"
          fi

      - name: Run headless probe suite
        run: BUILD_DIR=build bash native/tools/run-headless-probes.sh

  # RetroPark's driven-core probes are Windows/D3D11 + Vulkan only, so they cannot run on the Linux job above
  # (the RetroPark CMake block is WIN32-guarded and untouched there). This second job builds ONLY the two
  # RetroPark probes from the pinned public submodule (external/RetroPark) and runs them. The probes print
  # their success sentinel AND exit 0 even on a graceful no-D3D11-device skip, so a GPU-less runner stays
  # green; windows-latest has a WARP device, so D3D11 normally succeeds for real.
  retropark-windows:
    runs-on: windows-2022
    steps:
      # RetroPark is a PUBLIC submodule (cubman3134/RetroPark), so the default GITHUB_TOKEN clones it — no
      # secret / PAT / deploy key is needed.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # find_package(Vulkan REQUIRED) resolves against VULKAN_SDK, which this action exports to the env. Its
      # default install_runtime:true also drops vulkan-1.dll on the runner — required, because the built
      # probe .exe import-links vulkan-1 (RetroPark's static lib pulls Vulkan into its PUBLIC link) and would
      # fail to start without it. vulkan_version omitted -> latest SDK; that is all find_package needs.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      # Only the two RetroPark probes are built, so this configure needs neither Qt nor libmpv: the RetroPark
      # block sits OUTSIDE the EVERYTHINGBOX_BUILD_APP gate (that flag stays OFF, its default), and the app /
      # librashader / mpv find_package calls all live inside that gate. CMAKE_POLICY_VERSION_MINIMUM keeps a
      # future CMake 4.x from rejecting the pre-3.5 minimums in RetroPark's FetchContent deps.
      - name: Configure
        run: >
          cmake -S native -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # Targeted build: RetroPark itself (via the retropark_ext ExternalProject) plus the two probes — NOT the
      # whole app or all ~43 probes.
      - name: Build RetroPark probes
        run: cmake --build build --config Release --target probe_retropark --target probe_retropark_loop --target probe_retropark_content --target probe_retropark_present --target probe_retropark_apiselect --target probe_retropark_dolphin

      - name: Run RetroPark probes
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # STRICT set: these must print their sentinel AND must NOT skip. The three D3D11 probes always have a
          # WARP device on windows-2022; probe_retropark_apiselect is a pure header test that can never skip. A
          # SKIPPED here would mask a silent no-device (or inert-assertion) regression, so it fails the job.
          for pair in "probe_retropark:RETROPARK-OK" "probe_retropark_loop:RETROPARK-LOOP-OK" "probe_retropark_content:RETROPARK-CONTENT-OK" "probe_retropark_apiselect:RETROPARK-APISELECT-OK"; do
            exe="build/Release/${pair%%:*}.exe"
            token="${pair##*:}"
            echo "=== running $exe (expect $token) ==="
            if out="$("$exe")"; then rc=0; else rc=$?; fi
            echo "$out"
            if [ "$rc" -ne 0 ]; then echo "FAIL: $exe exited $rc"; fail=1; continue; fi
            if ! printf '%s\n' "$out" | grep -q "$token"; then
              echo "FAIL: sentinel $token absent from $exe output"; fail=1
            fi
            if printf '%s\n' "$out" | grep -q "SKIPPED"; then
              echo "FAIL: $exe reported SKIPPED — a device is expected on this runner"; fail=1
            fi
          done
          # probe_retropark_present (Slice 3a) needs a VULKAN device, which — unlike WARP D3D11 — is NOT guaranteed
          # on a GitHub windows-2022 runner (no discrete GPU, no bundled software Vulkan ICD). So it is graded more
          # leniently: the sentinel is still REQUIRED and a non-zero exit still FAILS, but a graceful SKIPPED (no
          # vulkan device) is ACCEPTED here rather than failed — the real Vulkan render is proven on a dev machine
          # with a device. If the runner ever does expose a Vulkan device the probe renders for real and still passes.
          echo "=== running build/Release/probe_retropark_present.exe (expect RETROPARK-PRESENT-OK) ==="
          if out="$(build/Release/probe_retropark_present.exe)"; then rc=0; else rc=$?; fi
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: probe_retropark_present exited $rc"; fail=1
          elif ! printf '%s\n' "$out" | grep -q "RETROPARK-PRESENT-OK"; then
            echo "FAIL: sentinel RETROPARK-PRESENT-OK absent from probe_retropark_present output"; fail=1
          elif printf '%s\n' "$out" | grep -q "SKIPPED"; then
            echo "(note) probe_retropark_present SKIPPED — no Vulkan device on this runner; accepted (real render is verified on a device)"
          fi
          # probe_retropark_dolphin (Slice 3b) is graded like _present, but ALSO skips when the LOCAL-ONLY Dolphin
          # vehicle is not staged — which is ALWAYS true on CI (dolphin_present.dll is git-ignored, never on a
          # runner). The sentinel is REQUIRED and a non-zero exit FAILS, but a graceful SKIPPED (no vulkan device
          # OR vehicle not staged) is ACCEPTED — the real Dolphin load is proven on a dev machine with the vehicle.
          echo "=== running build/Release/probe_retropark_dolphin.exe (expect RETROPARK-DOLPHIN-OK) ==="
          if out="$(build/Release/probe_retropark_dolphin.exe)"; then rc=0; else rc=$?; fi
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: probe_retropark_dolphin exited $rc"; fail=1
          elif ! printf '%s\n' "$out" | grep -q "RETROPARK-DOLPHIN-OK"; then
            echo "FAIL: sentinel RETROPARK-DOLPHIN-OK absent from probe_retropark_dolphin output"; fail=1
          elif printf '%s\n' "$out" | grep -q "SKIPPED"; then
            echo "(note) probe_retropark_dolphin SKIPPED — no Vulkan device or vehicle not staged; accepted (real load is verified on a dev machine with the vehicle)"
          fi
          [ "$fail" -eq 0 ] && echo "ALL RETROPARK PROBES PASSED"
          exit "$fail"
